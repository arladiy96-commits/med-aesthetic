<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MED AESTHETIC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<script>
(async()=>{
  const tg=window.Telegram?.WebApp;
  try{tg?.ready?.();tg?.expand?.();}catch(e){}
  const initData=tg?.initData||"";
  try{
    const r=await fetch("/api/me",{headers:{"X-Telegram-Init-Data":initData},cache:"no-store"});
    const me=await r.json();
    const role=String(me?.role||"client").toLowerCase();
    if(role==="client"){
      location.replace("/client/index.html?entry=client&build=20260830-exact-client-rollback2");
      return;
    }
    const platform=String(tg?.platform||"").toLowerCase();
    const mobile=["ios","android"].includes(platform) || (!["tdesktop","macos"].includes(platform) && innerWidth<900);
    location.replace((mobile?"/admin/mobile/index.html":"/admin/desktop/index.html")+"?entry="+encodeURIComponent(role));
  }catch(e){
    location.replace("/client/index.html?entry=client&build=20260830-exact-client-rollback2");
  }
})();
</script>
</body>
</html>
