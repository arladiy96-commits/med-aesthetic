<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>MED AESTHETIC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<script>
(async()=>{
  const tg=window.Telegram?.WebApp;
  try{tg?.ready?.();tg?.expand?.()}catch(e){}
  const params=new URLSearchParams(location.search);
  const hinted=params.get("entry");
  let actualRole=(hinted==="creator"||hinted==="admin"||hinted==="client")?hinted:null;
  try{
    const res=await fetch("/api/me",{cache:"no-store",headers:{"X-Telegram-Init-Data":tg?.initData||""}});
    const data=await res.json().catch(()=>({}));
    if(res.ok) actualRole=String(data?.user?.actualRole||data?.actualRole||"client").toLowerCase();
  }catch(e){}
  if(actualRole==="creator"||actualRole==="admin"){
    location.replace(`/admin/mobile/index.html?entry=${actualRole}`);
  }else{
    location.replace("/client/index.html?entry=client");
  }
})();
</script>
</body>
</html>
