/* MED AESTHETIC CLIENT v11 — JRMA root-path compatible */
*{box-sizing:border-box}
:root{
  --bg:#07050c;
  --bg2:#0d0717;
  --card:#12101a;
  --card2:#17121f;
  --line:rgba(222,173,80,.20);
  --line2:rgba(255,255,255,.07);
  --gold:#e4b75d;
  --gold2:#f4d48e;
  --violet:#6d2cff;
  --violet2:#a460ff;
  --text:#f7f2ff;
  --muted:#8f8997;
  --good:#70d89a;
  --danger:#ff6f85;
  --shadow:0 18px 46px rgba(0,0,0,.42);
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  background:
    radial-gradient(700px 380px at 85% -80px,rgba(113,32,191,.22),transparent 62%),
    radial-gradient(540px 350px at -20% 25%,rgba(107,44,255,.09),transparent 60%),
    linear-gradient(180deg,#08060e 0%,#07050c 100%);
  overflow-x:hidden;
}
button,input{font:inherit}
button{color:inherit}
img{display:block;width:100%;object-fit:cover}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.page{padding:0 14px 22px}
.safe-top{height:max(8px,env(safe-area-inset-top))}
.topbar{
  position:sticky;top:0;z-index:40;margin:0 -14px;padding:10px 14px 11px;
  background:linear-gradient(180deg,rgba(8,6,14,.97),rgba(8,6,14,.89));
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.045)
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:700;letter-spacing:.8px;color:var(--gold2)}
.brand span{color:#fff}
.icon-btn{
  border:1px solid var(--line2);background:#11101a;width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)
}
.icon-btn.gold{border-color:rgba(228,183,93,.28);color:var(--gold)}
.hero{
  position:relative;overflow:hidden;border:1px solid rgba(228,183,93,.22);border-radius:26px;
  min-height:320px;margin-top:14px;background:#12081d;box-shadow:var(--shadow)
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(7,4,13,.97) 0%,rgba(7,4,13,.80) 38%,rgba(7,4,13,.12) 78%),
             linear-gradient(180deg,transparent 55%,rgba(7,4,13,.72) 100%);
  pointer-events:none
}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;filter:saturate(.82) contrast(1.05)}
.hero-orb{position:absolute;right:-80px;top:-80px;width:250px;height:250px;border-radius:50%;background:rgba(122,34,255,.27);filter:blur(44px)}
.hero-content{position:relative;z-index:2;width:64%;padding:28px 20px 23px}
.eyebrow{text-transform:uppercase;letter-spacing:2.3px;color:var(--gold2);font-size:10px;font-weight:800}
.hero h1{font-family:"Cormorant Garamond",serif;font-size:34px;line-height:.98;margin:11px 0 10px}
.hero p{font-size:11px;line-height:1.55;color:#c6bfce;margin:0 0 18px}
.btn-primary{
  border:1px solid #d5a348;background:linear-gradient(135deg,#d5a348,#f1cf84);
  color:#201406;min-height:44px;padding:0 18px;border-radius:13px;font-weight:800;box-shadow:0 10px 28px rgba(224,174,76,.19)
}
.btn-primary:active,.quick:active,.service-card:active,.master-pill:active,.booking-card:active{transform:scale(.985)}
.section{margin-top:23px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}
.section-head h2{font-size:15px;margin:0;font-weight:800}
.section-head button{border:0;background:none;color:var(--gold);font-size:10px;padding:4px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick{
  border:1px solid var(--line2);background:linear-gradient(180deg,#15121d,#0f0d15);
  border-radius:16px;padding:12px 5px 10px;text-align:center;min-height:74px
}
.quick .qicon{font-size:20px;color:var(--gold);height:26px}
.quick span{display:block;color:#bbb4c2;font-size:9px;margin-top:4px}
.service-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:10px;overflow-x:auto;padding:1px 1px 6px;scrollbar-width:none}
.service-scroll::-webkit-scrollbar,.masters::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.service-card{
  border:1px solid rgba(228,183,93,.22);background:linear-gradient(180deg,#17121f,#0f0d15);
  padding:0;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 9px 25px rgba(0,0,0,.16)
}
.service-card img{height:112px;background:#1b1424}
.service-card .body{padding:10px}
.service-card b{font-size:11px;display:block;line-height:1.25}
.service-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;color:var(--muted);font-size:9px}
.service-card .price{color:var(--gold2);font-weight:800}
.masters{display:grid;grid-auto-flow:column;grid-auto-columns:74px;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.master-pill{border:0;background:none;padding:0;text-align:center}
.master-pill img{width:58px;height:58px;margin:auto;border-radius:50%;border:1px solid rgba(228,183,93,.42);padding:2px;background:#17121f}
.master-pill b{display:block;font-size:9.5px;margin-top:6px}
.master-pill span{display:block;font-size:7.8px;color:var(--muted);margin-top:2px}
.promo{
  margin-top:14px;border:1px solid rgba(136,70,255,.26);background:
  radial-gradient(300px 130px at 15% 20%,rgba(120,49,226,.2),transparent 62%),
  linear-gradient(135deg,#161022,#0f0c16);
  border-radius:19px;padding:14px;display:flex;justify-content:space-between;align-items:center
}
.promo strong{font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--gold2)}
.promo p{margin:3px 0 0;font-size:9px;color:var(--muted)}
.promo .gift{font-size:28px}
.page-title{font-family:"Cormorant Garamond",serif;font-size:30px;margin:20px 0 4px}
.page-sub{color:var(--muted);font-size:11px;margin:0 0 15px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:4px -14px 12px;padding:0 14px}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:#111019;color:#aaa4b2;border-radius:999px;padding:8px 12px;font-size:9px}
.chip.active{border-color:rgba(228,183,93,.52);background:rgba(228,183,93,.11);color:var(--gold2)}
.service-list{display:grid;gap:10px}
.service-row{
  display:grid;grid-template-columns:84px 1fr auto;gap:11px;align-items:center;
  border:1px solid var(--line2);background:linear-gradient(180deg,#15131b,#0f0e14);
  border-radius:17px;padding:8px;text-align:left
}
.service-row img{width:84px;height:74px;border-radius:12px}
.service-row h3{font-size:12px;margin:0 0 5px}
.service-row p{font-size:8.8px;color:var(--muted);line-height:1.4;margin:0}
.service-row .row-meta{font-size:9px;margin-top:7px;color:var(--gold2);font-weight:800}
.chev{color:var(--gold);font-size:18px;padding-right:5px}
.detail-cover{height:270px;margin:12px -14px 0;position:relative;overflow:hidden}
.detail-cover img{height:100%}
.detail-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 54%,#07050c)}
.back-float{position:absolute;z-index:4;left:14px;top:14px}
.heart-float{position:absolute;z-index:4;right:14px;top:14px}
.detail-box{margin-top:-38px;position:relative;z-index:3}
.detail-box h1{font-family:"Cormorant Garamond",serif;font-size:30px;margin:0 0 5px}
.detail-price{display:flex;align-items:center;justify-content:space-between;color:var(--gold2);font-weight:800;font-size:14px}
.detail-price span{font-size:10px;color:var(--muted);font-weight:600}
.detail-copy{font-size:10px;line-height:1.6;color:#b9b3c1;margin-top:15px}
.includes{border-top:1px solid var(--line2);margin-top:15px;padding-top:14px}
.includes h3{font-size:12px;margin:0 0 9px}
.includes div{font-size:10px;color:#c7c0cd;margin:7px 0}
.includes div:before{content:"✓";color:var(--gold);margin-right:8px}
.sticky-action{
  position:sticky;bottom:84px;z-index:20;margin:18px 0 0;padding:10px 0;
  background:linear-gradient(180deg,transparent,rgba(7,5,12,.93) 30%)
}
.sticky-action .btn-primary{width:100%}
.master-list{display:grid;gap:10px}
.master-card{
  display:grid;grid-template-columns:62px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line2);
  background:#121018;border-radius:18px;padding:10px
}
.master-card.selected{border-color:rgba(228,183,93,.55);box-shadow:0 0 0 1px rgba(228,183,93,.08)}
.master-card img{width:62px;height:62px;border-radius:16px}
.master-card h3{font-size:12px;margin:0 0 3px}
.master-card p{font-size:8.7px;color:var(--muted);margin:2px 0}
.rating{color:var(--gold2);font-size:9px;margin-top:5px}
.select-btn{border:1px solid rgba(228,183,93,.35);background:rgba(228,183,93,.08);color:var(--gold2);border-radius:10px;padding:8px 10px;font-size:9px}
.calendar-card{border:1px solid var(--line2);background:#111019;border-radius:20px;padding:13px;margin-top:12px}
.date-strip{display:grid;grid-auto-flow:column;grid-auto-columns:57px;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.date-btn{border:1px solid var(--line2);background:#0d0c12;border-radius:14px;padding:9px 4px;color:#918b98;text-align:center}
.date-btn span{display:block;font-size:8px;text-transform:uppercase}
.date-btn b{display:block;font-size:16px;margin:3px 0}
.date-btn small{font-size:7px}
.date-btn.active{border-color:var(--gold);background:linear-gradient(180deg,#d7aa53,#a8792e);color:#160e05}
.time-title{font-size:12px;font-weight:800;margin:18px 0 10px}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time-btn{border:1px solid rgba(228,183,93,.27);background:#100e16;border-radius:12px;padding:11px 5px;color:var(--gold2);font-size:10px}
.time-btn.active{background:linear-gradient(135deg,#d7a950,#f0ce82);color:#1b1208;font-weight:800}
.summary{
  border:1px solid rgba(228,183,93,.22);background:linear-gradient(180deg,#15111d,#0e0c13);
  border-radius:19px;padding:14px;margin-top:17px
}
.summary h3{font-size:11px;margin:0 0 10px;color:var(--gold2)}
.summary-line{display:flex;justify-content:space-between;gap:20px;font-size:9px;color:var(--muted);margin:7px 0}
.summary-line b{color:#eee9f2;text-align:right;font-weight:700}
.confirm-wrap{text-align:center;padding:48px 5px 10px}
.confirm-icon{
  width:94px;height:94px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:43px;
  color:#1b1207;background:linear-gradient(135deg,#e1b55e,#f6db9d);box-shadow:0 0 55px rgba(228,183,93,.18)
}
.confirm-wrap h1{font-family:"Cormorant Garamond",serif;font-size:32px;margin:0 0 8px}
.confirm-wrap p{font-size:10px;color:var(--muted);line-height:1.55}
.booking-card{
  border:1px solid var(--line2);background:linear-gradient(180deg,#15121d,#0f0d14);
  border-radius:18px;padding:12px;display:grid;grid-template-columns:60px 1fr auto;gap:11px;align-items:center;margin-bottom:10px;text-align:left
}
.booking-card img{width:60px;height:60px;border-radius:14px}
.booking-card h3{font-size:11px;margin:0 0 4px}
.booking-card p{font-size:8.6px;color:var(--muted);margin:2px 0}
.status-pill{font-size:7.5px;border-radius:999px;padding:5px 7px;background:rgba(228,183,93,.10);color:var(--gold2);white-space:nowrap}
.status-pill.done{background:rgba(112,216,154,.09);color:var(--good)}
.empty{border:1px dashed rgba(255,255,255,.12);border-radius:20px;padding:35px 20px;text-align:center;color:var(--muted);font-size:10px}
.profile-head{display:flex;align-items:center;gap:13px;margin-top:20px}
.profile-avatar{width:68px;height:68px;border-radius:22px;border:1px solid rgba(228,183,93,.35);object-fit:cover}
.profile-head h2{font-size:17px;margin:0 0 3px}
.profile-head p{font-size:9px;color:var(--muted);margin:0}
.menu-list{border:1px solid var(--line2);border-radius:20px;overflow:hidden;margin-top:17px;background:#111019}
.menu-item{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{width:28px;text-align:center;color:var(--gold)}
.menu-item b{font-size:10px;flex:1}
.menu-item span{font-size:9px;color:var(--muted)}
.bonus-card{
  border:1px solid rgba(228,183,93,.26);background:
  radial-gradient(300px 160px at 85% 0%,rgba(109,44,255,.22),transparent 70%),
  linear-gradient(140deg,#1a1027,#0e0b14);
  border-radius:24px;padding:20px;margin-top:16px
}
.bonus-card small{color:#aaa2b2;font-size:9px}
.bonus-card strong{display:block;font-family:"Cormorant Garamond",serif;font-size:44px;color:var(--gold2);line-height:1.05;margin-top:4px}
.bonus-status{display:flex;justify-content:space-between;border-top:1px solid var(--line2);margin-top:16px;padding-top:13px;font-size:9px}
.bottom-nav{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,5,12,.80),rgba(7,5,12,.98) 20%);
  backdrop-filter:blur(18px)
}
.nav-inner{border:1px solid var(--line2);background:rgba(17,15,23,.94);border-radius:24px;padding:8px 5px 7px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.nav-btn{border:0;background:none;color:#77727f;padding:3px 2px;min-width:0}
.nav-btn .nav-icon{font-size:18px;height:23px}
.nav-btn span{display:block;font-size:7.5px;white-space:nowrap}
.nav-btn.active{color:var(--gold2)}
.toast{
  position:fixed;z-index:100;left:50%;bottom:105px;transform:translate(-50%,15px);opacity:0;
  background:#eee7f6;color:#130e18;padding:10px 14px;border-radius:999px;font-size:9px;font-weight:800;
  pointer-events:none;transition:.22s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-flex;align-items:center;gap:5px;color:var(--gold2);font-size:8px;margin-top:4px}
.search-box{display:flex;gap:8px;border:1px solid var(--line2);background:#111019;border-radius:15px;padding:10px 12px;margin:12px 0}
.search-box input{border:0;outline:0;background:transparent;color:#fff;width:100%;font-size:10px}
.search-box input::placeholder{color:#6f6976}
@media(min-width:520px){
  #app{border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}
  .service-scroll{grid-auto-columns:31%}
}


/* v5 — Telegram fullscreen + fixed Mini App shell */
html,body{
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
body{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:var(--beauty-vh,100dvh)!important;
  max-height:var(--beauty-vh,100dvh)!important;
  touch-action:manipulation;
}
#app{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  max-width:620px!important;
  height:var(--beauty-vh,100dvh)!important;
  max-height:var(--beauty-vh,100dvh)!important;
  margin:0 auto!important;
  overflow-x:hidden!important;
  overflow-y:auto!important;
  overscroll-behavior-y:contain!important;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(96px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-bottom,0px)))!important;
}
.safe-top{
  height:max(8px,env(safe-area-inset-top,0px),var(--tg-safe-top,0px))!important;
}
.bottom-nav{
  padding-bottom:calc(8px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-bottom,0px)))!important;
}
/* Stop Safari/Telegram rubber-band on the outer document. */
html,body{touch-action:none}
#app, #app *{touch-action:auto}


.brand-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(2px);
}
.brand-sub{
  margin-top:4px;
  font-size:7px;
  line-height:1;
  letter-spacing:1.6px;
  text-transform:lowercase;
  color:#8f8997;
  white-space:nowrap;
}
/* Move the whole app header a little lower under Telegram's fullscreen controls. */
.safe-top{
  height:calc(max(8px,env(safe-area-inset-top,0px),var(--tg-safe-top,0px)) + 10px)!important;
}
.topbar{
  padding-top:12px!important;
}


/* v7 — enlarged top brand area, centered below Telegram system controls */
.safe-top{
  height:0!important;
  min-height:0!important;
}

.topbar{
  position:sticky!important;
  top:0!important;
  z-index:40!important;
  margin:0 -14px!important;

  /* The tile itself now covers the whole upper system-control area. */
  min-height:calc(max(
    env(safe-area-inset-top,0px),
    var(--tg-safe-top,0px),
    44px

  padding:
    calc(max(
      env(safe-area-inset-top,0px),
      var(--tg-safe-top,0px),
      44px
    ) + 8px)
    14px
    12px!important;

  display:flex!important;
  align-items:center!important;

  background:
    linear-gradient(180deg,rgba(8,6,14,.995),rgba(8,6,14,.94))!important;
  border-bottom:1px solid rgba(255,255,255,.055)!important;
  backdrop-filter:blur(18px)!important;
  -webkit-backdrop-filter:blur(18px)!important;
}

.toprow{
  position:relative!important;
  width:100%!important;
  min-height:52px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
}

.brand-wrap{
  position:absolute!important;
  left:50%!important;
  top:50%!important;
  transform:translate(-50%,-50%)!important;
  width:max-content!important;
  max-width:calc(100% - 112px)!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  line-height:1!important;
}

.brand{
  text-align:center!important;
  white-space:nowrap!important;
}

.brand-sub{
  text-align:center!important;
  white-space:nowrap!important;
}


/* v8 — brand is pinned to the lower part of the top tile, safely below Telegram controls */
.topbar{
  min-height:210px!important;
  padding:0 14px 14px!important;
  display:block!important;
}

.toprow{
  position:relative!important;
  width:100%!important;
  height:196px!important;
  min-height:196px!important;
}

.toprow > .icon-btn{
  position:absolute!important;
  top:118px!important;
}
.toprow > .icon-btn:first-child{left:0!important;}
.toprow > .icon-btn:last-child{right:0!important;}

/* Main title sits in its own clear zone below the system buttons */
.brand-wrap{
  position:absolute!important;
  left:50%!important;
  top:auto!important;
  bottom:18px!important;
  transform:translateX(-50%)!important;
  width:calc(100% - 120px)!important;
  max-width:none!important;
  text-align:center!important;
}

.brand{
  width:100%!important;
  text-align:center!important;
  font-size:28px!important;
  line-height:1.05!important;
}

.brand-sub{
  margin-top:7px!important;
  text-align:center!important;
  font-size:7.5px!important;
  letter-spacing:2px!important;
}


/* v9 — compact top area: below Telegram controls without wasting vertical space */
.topbar{
  min-height:160px!important;
  height:160px!important;
  padding:0 14px 10px!important;
}

.toprow{
  height:150px!important;
  min-height:150px!important;
}

/* Our own buttons sit on the same lower row as the brand, below Telegram controls. */
.toprow > .icon-btn{
  top:92px!important;
}

/* Raise the brand compared with v8, while keeping it safely below Telegram overlay. */
.brand-wrap{

  async function bookingApi(path="", options={}){
    const headers = {
      "Content-Type":"application/json",
      "X-Telegram-Init-Data": tg?.initData || "",
      "X-Act-As-Role": S.roleMode || "client",
      ...(options.headers || {})
    };
    const res = await fetch("/api/bookings" + path, {...options, headers});
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail || data.error || "Ошибка сервера");
    return data;
  }

  async function loadIdentity(){
    try{
      const res = await fetch("/api/me",{
        headers:{
          "X-Telegram-Init-Data": tg?.initData || ""
        }
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.detail || "Не удалось определить роль");
      S.actualRole = data?.user?.actualRole || "client";
      S.roleSwitch = Array.isArray(data?.roleSwitch) ? data.roleSwitch : [S.actualRole];
      try{
        if(S.actualRole === "creator" || S.actualRole === "admin")
          localStorage.setItem("medAestheticActualRole", S.actualRole);
        else
          localStorage.removeItem("medAestheticActualRole");
      }catch(e){}

      // Сервер только подтверждает права. Если staff уже открылся как staff,
      // экран не прыгает. Если ссылка была подделана клиентом — безопасно
      // возвращаем его в клиентскую часть после проверки.
      if(S.actualRole === "client"){
        S.roleMode = "client";
        if(!["home","services","service","masters","datetime","confirm","booking","history","profile","bonus"].includes(S.view))
          S.view = "home";
      }else if(!S.roleSwitch.includes(S.roleMode)){
        S.roleMode = S.actualRole;
        S.view = "admin-home";
      }else if(S.roleMode !== "client" && !String(S.view).startsWith("admin-")){
        S.view = "admin-home";
      }
    }catch(e){
      console.error("Role load failed:",e);
      // При ошибке проверки прав безопасно оставляем клиентский режим.
      S.actualRole="client";
      S.roleMode="client";
      S.roleSwitch=["client"];
      S.view="home";
      try{ localStorage.removeItem("medAestheticActualRole"); }catch(_e){}
    }finally{
      S.identityReady=true;
      render();
    }
  }

  function dates(){

    for(let i=1;i<=14;i++){
      const d=new Date();d.setDate(d.getDate()+i);
      const iso=d.toISOString().slice(0,10);
      a.push({iso,day:d.getDate(),w:weekdays[d.getDay()],m:months[d.getMonth()]});
    }
    return a;
  }

    const avatar=user?.photo_url || "";
    return `<div class="admin-safe"></div><header class="admin-header">
      <div class="admin-brand"><div class="admin-brand-title">MED <span>AESTHETIC</span></div><div class="admin-role">${esc(ruRole(S.roleMode))} · ${esc(name)}</div></div>
      <div class="admin-head-actions">
        ${S.actualRole==="creator"?`<button class="admin-round" onclick="Beauty.openRoleSheet()" aria-label="Переключить роль">♛</button>`:`<button class="admin-round" onclick="Beauty.toast('Новых уведомлений нет')">♧</button>`}
        ${avatar?`<img class="admin-avatar" src="${avatar}" alt="">`:`<div class="admin-avatar" style="display:grid;place-items:center;color:var(--admin-accent2);font-weight:800">${esc((name||"A").slice(0,1).toUpperCase())}</div>`}
      </div>
    </header>`;
  }

  function roleSheet(){
    if(!S.roleSheet)return "";
    const labels={creator:["♛","Создатель","Полный доступ ко всем разделам"],admin:["◇","Администратор","Рабочая админ-панель"],client:["♡","Клиент","Полный клиентский сценарий"]};
    return `<div class="role-sheet-backdrop" onclick="if(event.target===this)Beauty.closeRoleSheet()"><div class="role-sheet"><h3>♛ Режим создателя</h3><p>Переключение меняет рабочую роль для тестирования, но не ваши реальные права.</p>${S.roleSwitch.map(role=>{const x=labels[role]||labels.client;return `<button class="role-choice ${S.roleMode===role?"active":""}" onclick="Beauty.switchRole('${role}')"><div><b>${x[0]} ${x[1]}</b><span>${x[2]}</span></div><strong>${S.roleMode===role?"✓":"›"}</strong></button>`}).join("")}</div></div>`;
  }

  function testModeBar(){
    if(S.roleMode!=="client" || !["creator","admin"].includes(S.actualRole))return "";
    return `<div class="test-mode-bar"><span>${S.actualRole==="creator"?"♛":"◇"} Тест: клиент</span><button onclick="Beauty.switchRole('${S.actualRole}')">Вернуться в ${S.actualRole==="creator"?"создателя":"админку"}</button></div>`;
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function adminTodayBookings(){ return serverBookings.filter(b=>String(b.date||"").slice(0,10)===todayISO()); }
  function sortedAdminBookings(){ return [...serverBookings].sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time))); }
  function adminNearest(){
    const now=new Date();
    return sortedAdminBookings().find(b=>{
      const d=new Date(`${b.date}T${b.time||"00:00"}:00`);
      return Number.isFinite(d.getTime()) && d>=now;
    }) || sortedAdminBookings()[0] || null;
  }
  function niceToday(){
    return new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
  }
  function adminMetric(value,label,p=50,small=""){
    return `<div class="admin-metric"><div class="admin-ring" style="--p:${Math.max(2,Math.min(100,p))}"><b>${esc(value)}</b></div><span>${esc(label)}</span>${small?`<small>${esc(small)}</small>`:""}</div>`;
  }
  function adminBookingRow(b){
    const s=services.find(x=>x.id===b.serviceId)||{};
    const m=masters.find(x=>x.id===b.masterId)||{};
    return `<button class="admin-book-row" onclick="Beauty.bookingInfo('${b.id}')"><div class="t">${esc(b.time||"—")}</div><div><h3>${esc(b.serviceName||s.name||"Запись")}</h3><p>${esc(b.masterName||m.name||"Мастер не указан")} · ${esc(b.date||"")}</p></div><div class="dots">⋮</div></button>`;
  }

  function adminHome(){
    const today=adminTodayBookings();
    const nearest=adminNearest();
    const total=serverBookings.length;
    return `<main class="admin-page">${adminHeader()}
      <div class="admin-date-row"><div><h1>Сегодня</h1><p>${esc(niceToday())}</p></div><button class="admin-link" onclick="Beauty.go('admin-calendar')">Открыть календарь ›</button></div>
      <div class="admin-metrics">
        ${adminMetric(String(total),"Записи",Math.min(100,total*13),total?"активные":"пока нет")}
        ${adminMetric(String(today.length),"Сегодня",Math.min(100,today.length*20),today.length?"по плану":"свободно")}
        ${adminMetric("—","Клиенты",42,"подключим")}
        ${adminMetric("0","Требует внимания",6,"всё спокойно")}
      </div>
      <section class="admin-section"><div class="admin-section-title"><h2>Ближайшая запись</h2><button onclick="Beauty.go('admin-bookings')">Все записи</button></div>
        ${nearest?`<div class="admin-next"><div class="admin-time">${esc(nearest.time||"—")}</div><div><h3>${esc(nearest.serviceName||"Услуга")}</h3><p>${esc(nearest.masterName||"Мастер не указан")}</p><p>${esc(nearest.date||"")}</p></div><span class="admin-status">Активна</span></div>`:`<div class="admin-empty">Ближайших записей пока нет. Как только появятся реальные записи, они автоматически будут отображаться здесь.</div>`}
      </section>
      <section class="admin-section"><div class="admin-section-title"><h2>Быстрые действия</h2><span>1–2 касания</span></div><div class="admin-actions">
        <button class="admin-action" onclick="Beauty.toast('Ручную запись подключим к расписанию')"><i>＋</i><b>Новая запись</b></button>
        <button class="admin-action" onclick="Beauty.go('admin-clients')"><i>♙</i><b>Клиент</b></button>
        <button class="admin-action" onclick="Beauty.toast('Редактор услуг — следующий этап')"><i>⌘</i><b>Услуги</b></button>
        <button class="admin-action" onclick="Beauty.go('admin-calendar')"><i>□</i><b>Расписание</b></button>
      </div></section>
      <section class="admin-section"><div class="admin-section-title"><h2>Автоматизация</h2><span>Работает без ручной рутины</span></div><div class="automation-card">
        <div class="auto-row"><div class="auto-ico">✓</div><div><b>Онлайн-запись</b><p>Клиент записывается самостоятельно</p></div><span class="auto-state">Включено</span></div>
        <div class="auto-row"><div class="auto-ico">♧</div><div><b>Напоминания</b><p>Подготовлено место под автоматические уведомления</p></div><span class="auto-state">Следом</span></div>
        <div class="auto-row"><div class="auto-ico">↻</div><div><b>Освободившиеся окна</b><p>Автопредложение свободного времени</p></div><span class="auto-state">Следом</span></div>
      </div></section>
    </main>${adminNav("admin-home")}${roleSheet()}`;
  }

  function adminBookingsView(){
    const list=sortedAdminBookings();
    return `<main class="admin-page">${adminHeader()}<div class="admin-date-row"><div><h1>Записи</h1><p>Быстрый контроль расписания</p></div><button class="admin-link" onclick="Beauty.toast('Поиск подключим вместе с клиентской базой')">⌕ Поиск</button></div>
      <div class="admin-filter">${["Сегодня","Завтра","Неделя","Все"].map(x=>`<button class="${S.adminFilter===x?"active":""}" onclick="Beauty.setAdminFilter('${x}')">${x}</button>`).join("")}</div>
      <div class="admin-list">${list.length?list.map(adminBookingRow).join(""):`<div class="admin-empty">Записей пока нет.</div>`}</div>
      <section class="admin-section"><button class="btn-primary" style="width:100%;background:linear-gradient(135deg,#7651e8,#9c72ff);border-color:#9570ff;color:white" onclick="Beauty.toast('Ручную запись подключим следующим шагом')">＋ Новая запись</button></section>
    </main>${adminNav("admin-bookings")}${roleSheet()}`;
  }

  function adminCalendarView(){
    const ds=[];const w=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
    for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);ds.push({iso:d.toISOString().slice(0,10),day:d.getDate(),w:w[d.getDay()]})}
    if(!S.adminDate)S.adminDate=ds[0].iso;
    const selected=serverBookings.filter(b=>String(b.date||"").slice(0,10)===S.adminDate).sort((a,b)=>String(a.time).localeCompare(String(b.time)));
    return `<main class="admin-page">${adminHeader()}<div class="admin-date-row"><div><h1>Календарь</h1><p>Записи и свободные окна</p></div><button class="admin-link" onclick="Beauty.toast('Настройку рабочих часов добавим далее')">Настроить</button></div>
      <div class="admin-calendar"><div class="admin-week">${ds.map(d=>`<button class="admin-day ${S.adminDate===d.iso?"active":""}" onclick="Beauty.pickAdminDate('${d.iso}')"><span>${d.w}</span><b>${d.day}</b></button>`).join("")}</div>
      <div class="admin-timeline">${selected.length?selected.map(b=>`<div class="admin-slot"><div class="admin-slot-time">${esc(b.time||"—")}</div><div class="admin-slot-card"><b>${esc(b.serviceName||"Запись")}</b><span>${esc(b.masterName||"Мастер не указан")}</span></div></div>`).join(""):`<div class="admin-slot"><div class="admin-slot-time">День</div><div class="admin-slot-free">Свободно · записей нет</div></div>`}</div></div>
      <section class="admin-section"><div class="admin-actions"><button class="admin-action" onclick="Beauty.toast('Создание ручной записи — следующим шагом')"><i>＋</i><b>Добавить запись</b></button><button class="admin-action" onclick="Beauty.toast('Блокировку окна подключим к расписанию')"><i>×</i><b>Закрыть окно</b></button><button class="admin-action" onclick="Beauty.toast('Перерыв подключим к расписанию')"><i>☕</i><b>Перерыв</b></button><button class="admin-action" onclick="Beauty.toast('Выходной подключим к расписанию')"><i>○</i><b>Выходной</b></button></div></section>
    </main>${adminNav("admin-calendar")}${roleSheet()}`;
  }

  function adminClientsView(){
    return `<main class="admin-page">${adminHeader()}<div class="admin-date-row"><div><h1>Клиенты</h1><p>Карточки, история и повторные записи</p></div><button class="admin-link" onclick="Beauty.toast('Добавление клиента подключим вместе с базой клиентов')">＋ Добавить</button></div>
      <div class="search-box" style="margin-top:0">⌕ <input placeholder="Имя, Telegram, телефон" oninput="Beauty.toast('Поиск будет работать после подключения клиентской базы')"></div>
      <div class="admin-kpis"><div class="admin-kpi"><small>Клиентов в базе</small><strong>—</strong></div><div class="admin-kpi"><small>Новых за месяц</small><strong>—</strong></div></div>
      <section class="admin-section"><div class="admin-empty">Карточки реальных клиентов подключим к Neon следующим этапом. Никакие тестовые люди здесь не подставлены, чтобы не смешивать демо-данные с настоящими.</div></section>
    </main>${adminNav("admin-clients")}${roleSheet()}`;
  }

  function adminMoreView(){
    const creatorItem=S.actualRole==="creator"?`<button onclick="Beauty.toast('Управление администраторами подключим к уже готовым приглашениям')"><span class="ico">♛</span><div><b>Администраторы</b><small>Приглашения и права доступа</small></div><span class="go">›</span></button>`:"";
    return `<main class="admin-page">${adminHeader()}<div class="admin-date-row"><div><h1>Ещё</h1><p>Управление и автоматизация</p></div></div>
      <div class="admin-menu">
        <button onclick="Beauty.toast('Редактор услуг подключим следующим этапом')"><span class="ico">⌘</span><div><b>Услуги</b><small>Цены, длительность, доступность</small></div><span class="go">›</span></button>
        <button onclick="Beauty.go('admin-calendar')"><span class="ico">□</span><div><b>Расписание</b><small>Рабочие дни, перерывы, выходные</small></div><span class="go">›</span></button>
        <button onclick="Beauty.toast('Автоматические уведомления — следующий модуль')"><span class="ico">♧</span><div><b>Уведомления</b><small>Напоминания и сообщения клиентам</small></div><span class="go">›</span></button>
        <button onclick="Beauty.toast('Автоматизацию будем настраивать по сценариям')"><span class="ico">↻</span><div><b>Автоматизация</b><small>Правила без ручной работы</small></div><span class="go">›</span></button>
        ${creatorItem}
        <button onclick="Beauty.toast('Настройки появятся следующим этапом')"><span class="ico">⚙</span><div><b>Настройки</b><small>Интерфейс и параметры заведения</small></div><span class="go">›</span></button>
      </div>
      <div class="admin-client-switch"><div><b>Режим клиента</b><p>Полностью открыть приложение как покупатель</p></div><button class="switch-pill" onclick="Beauty.switchRole('client')"></button></div>
    </main>${adminNav("admin-more")}${roleSheet()}`;
  }

  function bookingInfo(id){
    const b=serverBookings.find(x=>String(x.id)===String(id));
    if(!b){toast("Запись из истории");return}
    const s=services.find(x=>x.id===b.serviceId), m=masters.find(x=>x.id===b.masterId);
    toast(`${b.serviceName||s?.name||"Услуга"} · ${b.masterName||m?.name||"Мастер"} · ${b.date} ${b.time}`);
  }

  function render(){
    // Никаких экранов «определяем роль»: интерфейс показывается сразу.
    let html="";
    if(S.view==="admin-home")html=adminHome();
    else if(S.view==="admin-bookings")html=adminBookingsView();
    else if(S.view==="admin-calendar")html=adminCalendarView();
    else if(S.view==="admin-clients")html=adminClientsView();
    else if(S.view==="admin-more")html=adminMoreView();
    else if(S.view==="home")html=home();
    else if(S.view==="services")html=servicesView();
    else if(S.view==="service")html=serviceDetail();
    else if(S.view==="masters")html=mastersView();
    else if(S.view==="datetime")html=datetimeView();
    else if(S.view==="confirm")html=confirmView();
    else if(S.view==="booking")html=bookingView();
    else if(S.view==="history")html=historyView();
    else if(S.view==="profile")html=profileView();
    else if(S.view==="bonus")html=bonusView();
    else html=isStaffMode()?adminHome():home();
    document.querySelector("#app").innerHTML=html + testModeBar();
  }

  window.Beauty = {
    go,
    toast,
    openRoleSheet(){S.roleSheet=true;render();haptic()},
    closeRoleSheet(){S.roleSheet=false;render()},
    switchRole(role){
      if(!S.roleSwitch.includes(role))return;
      S.roleMode=role;
      S.roleSheet=false;
      S.view=role==="client"?"home":"admin-home";
      render();
      window.scrollTo(0,0);
      haptic("medium");
    },
    setAdminFilter(v){S.adminFilter=v;render();haptic()},
    pickAdminDate(v){S.adminDate=v;render();haptic()},
    openCategory(c){
      S.category=c;
      S.view="services";
      render();
      document.querySelector("#app")?.scrollTo?.({top:0,behavior:"smooth"});
      haptic();
    },
    setCategory(c){S.category=c;render()},
    filterServices(q){
      q=q.trim().toLowerCase();
      document.querySelectorAll("#serviceList .service-row").forEach(el=>{
        el.style.display=el.dataset.name.includes(q)?"grid":"none";
      });
    },
    openService(id){S.service=services.find(x=>x.id===id);S.master=null;S.time=null;S.view="service";render();window.scrollTo(0,0);haptic()},
    startBooking(id){S.service=services.find(x=>x.id===id);S.master=null;S.date=null;S.time=null;go("masters")},
    openMaster(id){S.master=masters.find(x=>x.id===id);if(!S.service){S.service=services[0]}go("masters")},
    selectMaster(id){S.master=masters.find(x=>x.id===id);render();haptic()},
    pickDate(d){S.date=d;S.time=null;render();haptic()},
    pickTime(t){S.time=t;render();haptic()},
    async confirmBooking(){
      if(!S.service||!S.master||!S.date||!S.time)return;
      try{
        const data = await bookingApi("",{
          method:"POST",
          body:JSON.stringify({
            service_id:S.service.id,
            service_name:S.service.name,
            master_id:S.master.id,
            master_name:S.master.name,
            booking_date:S.date,
            booking_time:S.time
          })
        });
        if(data.booking) serverBookings.unshift(data.booking);
        S.view="confirm";
        render();
        haptic("medium");
      }catch(e){
        toast(e.message || "Не удалось создать запись");
      }
    },
    bookingInfo
  };

  render();
  Promise.allSettled([loadBookings(),loadIdentity()]);
})();
  </script>
</body>
</html>
