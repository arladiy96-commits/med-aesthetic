<style id="booking-keyboard-kz-fix">
/* While the iOS keyboard is open, fixed bottom controls must not cover inputs. */
/* Remove the ENTIRE fixed bottom UI from rendering while iOS changes
   visualViewport. display:none means there is no fixed layer available to jump. */
.booking-keyboard-open .page-booking .sticky-action,
.booking-keyboard-open .bottom-nav{
  display:none!important;
}

/* Bottom fixed UI never animates its geometry. */
.page-booking .sticky-action,
.bottom-nav{
  transition:none!important;
  animation:none!important;
  will-change:auto!important;
}

/* Keep page geometry constant. Do not change padding when keyboard opens. */
.booking-keyboard-open .page-booking{
  padding-bottom:calc(190px + env(safe-area-inset-bottom))!important;
}

.page-booking .booking-contact-field input{
  scroll-margin-top:120px;
  scroll-margin-bottom:36px;
}

#bookingClientPhone{
  font-variant-numeric:tabular-nums;
  letter-spacing:.025em;
}

/* iOS zooms pages when focused inputs are below 16px.
   Prevent that zoom/jump on the contact screen. */
@media (max-width:700px){
  .page-booking .booking-contact-field input{
    font-size:16px!important;
  }
}
</style>


<style id="instant-action-feedback">
.action-busy-content{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-width:0;
}

.action-busy-spinner{
  width:16px;
  height:16px;
  flex:0 0 16px;
  border-radius:50%;
  border:2px solid currentColor;
  border-right-color:transparent;
  animation:med-action-spin .68s linear infinite;
}

button.is-busy,
button:disabled.is-busy{
  cursor:default!important;
  pointer-events:none!important;
  opacity:.88!important;
}

.admin-booking-actions button:disabled:not(.is-busy){
  opacity:.42!important;
  pointer-events:none!important;
}

@keyframes med-action-spin{
  to{transform:rotate(360deg)}
}

@media (prefers-reduced-motion:reduce){
  .action-busy-spinner{animation-duration:1.25s}
}
</style>


<style id="booking-date-fixed-selection">
.booking-selected-date{
  margin:10px 2px 3px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}
.booking-selected-date b{
  color:var(--gold2);
  font-weight:800;
}
</style>


<style id="services-scroll-return-fix">
/* #app is the real vertical scroller. Prevent browser scroll anchoring
   from overriding the exact position we restore after rebuilding Services. */
#app.services-restoring-scroll{
  overflow-anchor:none!important;
}
</style>
